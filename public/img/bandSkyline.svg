<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 240" preserveAspectRatio="xMaxYMax meet">
  <!-- Waikiki and Diamond Head at dusk, for the background of the blue page band. Every layer
       is dark navy, so white text over it only gains contrast. -->
  <defs>
    <!-- One palm, planted at 0,0 -->
    <g id="palm">
      <path d="M-5 0 C-2 -50 8 -100 20 -148 L26 -146 C14 -98 6 -50 5 0 Z"/>
      <path d="M23 -148 C50 -168 85 -162 104 -130 C82 -150 52 -154 23 -144 Z"/>
      <path d="M23 -148 C-4 -170 -40 -164 -58 -134 C-36 -152 -6 -154 23 -144 Z"/>
      <path d="M23 -148 C40 -180 70 -190 92 -180 C66 -180 44 -170 24 -146 Z"/>
      <path d="M23 -148 C8 -182 -22 -192 -44 -182 C-18 -182 4 -170 22 -146 Z"/>
      <path d="M23 -148 C52 -150 74 -128 82 -96 C66 -124 46 -138 24 -144 Z"/>
      <path d="M23 -148 C-6 -150 -28 -126 -34 -94 C-18 -122 2 -138 22 -144 Z"/>
    </g>
  </defs>

  <g fill="#031d33">
    <!-- The Koʻolau range, far back -->
    <path fill-opacity="0.16" d="M0 240 L0 236 L50 226 L100 212 L140 214 L190 192 L230 198 L280 170 L320 178 L370 150 L410 160 L460 136 L505 148 L550 126 L600 140 L650 120 L695 134 L745 116 L795 132 L845 122 L895 140 L945 136 L995 156 L1050 166 L1110 182 L1170 192 L1240 200 L1330 210 L1450 220 L1600 226 L1600 240 Z"/>

    <!-- Diamond Head: a long ridge rising to Lēʻahi, then a steep face to the sea -->
    <path fill-opacity="0.24" d="M990 240 C1060 222 1120 196 1180 176 C1215 164 1240 160 1262 162 C1285 164 1300 152 1322 140 C1350 124 1378 104 1400 84 L1418 70 L1432 68 L1442 76 C1462 100 1486 150 1520 196 C1536 218 1552 232 1570 240 Z"/>

    <!-- Waikiki's towers -->
    <g fill-opacity="0.32">
      <rect x="420" y="196" width="34" height="44"/>
      <rect x="460" y="180" width="28" height="60"/>
      <rect x="494" y="204" width="40" height="36"/>
      <rect x="540" y="168" width="30" height="72"/>
      <rect x="576" y="186" width="44" height="54"/>
      <rect x="626" y="150" width="32" height="90"/>
      <rect x="664" y="172" width="26" height="68"/>
      <rect x="696" y="140" width="36" height="100"/>
      <rect x="712" y="128" width="3" height="12"/>
      <rect x="738" y="160" width="30" height="80"/>
      <rect x="774" y="128" width="40" height="112"/>
      <rect x="820" y="150" width="28" height="90"/>
      <rect x="854" y="118" width="34" height="122"/>
      <rect x="869" y="104" width="3" height="14"/>
      <rect x="894" y="146" width="30" height="94"/>
      <rect x="930" y="132" width="38" height="108"/>
      <rect x="974" y="160" width="28" height="80"/>
      <rect x="1008" y="146" width="34" height="94"/>
      <rect x="1048" y="176" width="30" height="64"/>
      <rect x="1084" y="190" width="40" height="50"/>
      <rect x="1130" y="206" width="36" height="34"/>
    </g>

    <!-- Palms in front. opacity (not fill-opacity) keeps overlapping fronds one even shade. -->
    <g opacity="0.42">
      <use href="#palm" transform="translate(330 240) scale(0.72)"/>
      <use href="#palm" transform="translate(378 240) scale(-0.56 0.56)"/>
      <use href="#palm" transform="translate(1188 240) scale(0.62)"/>
      <use href="#palm" transform="translate(1236 240) scale(-0.48 0.48)"/>
    </g>
  </g>
</svg>

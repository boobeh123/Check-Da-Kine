  <g fill="#ffffff">
    <rect x="3.8" y="19" width="3.6" height="8" rx="1"/>
    <rect x="9" y="16" width="3.6" height="11" rx="1"/>
    <rect x="14.2" y="12.5" width="3.6" height="14.5" rx="1"/>
    <rect x="24.6" y="18" width="3.6" height="9" rx="1"/>
  </g>
  <rect x="19.4" y="6" width="3.6" height="21" rx="1" fill="#f59e0b"/>
</svg>
